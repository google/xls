edition = "2023";

package xls;

import "google/api/field_behavior.proto";
import "ortools/math_opt/parameters.proto";

enum ProtoSchedulingStrategy {
  // This is aliased to SCHEDULER_TYPE_SDC.
  SCHEDULER_TYPE_UNSPECIFIED = 0;
  // The SDC (system-of-difference-constraints) scheduler.
  //
  // This scheduler is based on the work in:
  //   https://www.csl.cornell.edu/~zhiruz/pdfs/sdcmod-iccad2013.pdf
  // and is a general-purpose constraint optimizer.
  //
  // This is the default scheduler.
  SCHEDULER_TYPE_SDC = 1;
  // An alternative scheduler which simply attempts to create a feasible
  // schedule.
  //
  // Unlike SDC this scheduler does not attempt to minimize the number of
  // registers or evenly spread delay across the pipeline. Instead this simply
  // forces all computation into the earliest stage where it fits and all
  // predicates are available. As this scheduler is less constrained it is
  // faster to run than the SDC scheduler.
  //
  // This scheduler is primarily intended for use during development when
  // iteration speed is paramount. It should not be used to create the final
  // schedule for a design.
  SCHEDULER_TYPE_ASAP = 2;
  // An alternative scheduler which approximates the minimum number of registers
  // using a min-cut based algorithm.
  SCHEDULER_TYPE_MIN_CUT = 3;
  // A scheduler which randomly schedules nodes. For internal testing only.
  SCHEDULER_TYPE_RANDOM = 4;
}

enum SolverKind {
  SOLVER_KIND_UNSPECIFIED = 0;
  SOLVER_KIND_Z3 = 1;
  SOLVER_KIND_BITWUZLA = 2;
}

message SchedulingFailureBehaviorProto {
  bool explain_infeasibility = 1
      [default = true, (google.api.field_behavior) = REQUIRED];
  double infeasible_per_state_backedge_slack_pool = 2
      [(google.api.field_behavior) = OPTIONAL];
}

message ReadToThroughputProto {
  map<string, int64> read_to_throughput = 1;
}

// Flags passed to the benchmark_codegen_main, codegen_main,
// and sched_printer_main binary.
//
// See scheduling_options_flags.cc ABSL_FLAG()
// definitions for the meaning of these fields.
message SchedulingOptionsFlagsProto {
  int64 clock_period_ps = 1;
  int64 pipeline_stages = 2;
  string delay_model = 3;
  int64 clock_margin_percent = 4;
  int64 period_relaxation_percent = 5;
  // Intentionally has no explicit default: when unset, CLI behavior depends on
  // `minimize_worst_case_throughput` (0 if true, 1 otherwise).
  int64 worst_case_throughput = 6;
  int64 additional_input_delay_ps = 7;
  int64 additional_output_delay_ps = 31;
  map<string, int64> additional_channel_delay_ps = 33;
  int64 ffi_fallback_delay_ps = 8;
  repeated string io_constraints = 9;
  bool receives_first_sends_last = 10;
  int64 mutual_exclusion_z3_rlimit = 11 [default = -1];
  int64 default_next_value_z3_rlimit = 25 [default = -1];
  SchedulingFailureBehaviorProto failure_behavior = 23;
  bool use_fdo = 22;
  int64 fdo_iteration_number = 12 [default = 5];
  int64 fdo_delay_driven_path_number = 13 [default = 1];
  int64 fdo_fanout_driven_path_number = 14;
  float fdo_refinement_stochastic_ratio = 15 [default = 1.0];
  string fdo_path_evaluate_strategy = 16 [default = "window"];
  string fdo_synthesizer_name = 17 [default = "yosys"];
  string fdo_yosys_path = 18;
  string fdo_sta_path = 19;
  string fdo_synthesis_libraries = 20;
  string fdo_default_driver_cell = 28;
  string fdo_default_load = 29;
  bool minimize_clock_on_failure = 21 [default = true];
  bool multi_proc = 24 [default = true];
  bool minimize_worst_case_throughput = 26;
  bool recover_after_minimizing_clock = 27;
  int64 opt_level = 30 [default = 3];
  double dynamic_throughput_objective_weight = 32;
  bool merge_on_mutual_exclusion = 34 [default = true];
  double sdc_solution_tolerance = 35 [default = 0.001];
  operations_research.math_opt.SolverTypeProto solver_type = 36
      [default = SOLVER_TYPE_GLOP];
  operations_research.math_opt.SolveParametersProto solve_parameters = 37;
  // What sort of scheduler one should use.
  ProtoSchedulingStrategy scheduling_strategy = 38
      [default = SCHEDULER_TYPE_SDC];
  // What sort of scheduler to use when finding bounds. Intentionally has no
  // explicit default so unset inherits `scheduling_strategy`.
  ProtoSchedulingStrategy find_bounds_strategy = 39;
  // What sort of SMT solver to use for logical analysis (e.g., mutual
  // exclusion).
  SolverKind solver_kind = 42 [default = SOLVER_KIND_Z3];
  int64 default_arc_worst_case_throughput = 40;
  map<string, ReadToThroughputProto> arc_worst_case_throughput = 41;
}
